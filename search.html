<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Routes | TransitHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3"><link rel="stylesheet" href="css/animations.css?v=3"><link rel="stylesheet" href="css/responsive.css?v=3">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top glass-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-train-front"></i> TransitHub</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="chatbot.html">AI Assistant</a></li><li class="nav-item"><button class="btn btn-sm btn-outline-info theme-toggle" id="themeToggle"><i class="bi bi-moon-stars"></i></button></li></ul></div></div></nav>
  <main class="page-shell">
    <div class="container">
      <div class="page-heading"><p class="eyebrow">Search Results</p><h1>Available buses and trains</h1></div>
      <form class="glass-card route-search mb-4" id="routeSearchForm">
        <div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label">From</label><input class="form-control" id="fromCity"></div><div class="col-md-3"><label class="form-label">To</label><input class="form-control" id="toCity"></div><div class="col-md-2"><label class="form-label">Date</label><input type="date" class="form-control" id="travelDate"></div><div class="col-md-2"><label class="form-label">Type</label><select class="form-select" id="travelType"><option value="">Any</option><option>Bus</option><option>Train</option></select></div><div class="col-md-2"><button class="btn btn-info w-100" type="submit"><i class="bi bi-search"></i> Search</button></div></div>
      </form>
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="glass-card filters">
            <h2 class="h5">Filters</h2>
            <label class="form-check"><input class="form-check-input filter" type="checkbox" value="AC" data-filter="amenity"> AC</label>
            <label class="form-check"><input class="form-check-input filter" type="checkbox" value="Non-AC" data-filter="amenity"> Non-AC</label>
            <label class="form-check"><input class="form-check-input filter" type="checkbox" value="Sleeper" data-filter="amenity"> Sleeper</label>
            <label class="form-check"><input class="form-check-input filter" type="checkbox" value="Morning" data-filter="time"> Morning</label>
            <label class="form-check"><input class="form-check-input filter" type="checkbox" value="Evening" data-filter="time"> Evening</label>
            <label class="form-label mt-3">Max Price: <span id="priceLabel">2500</span></label>
            <input type="range" min="300" max="2500" value="2500" step="50" class="form-range" id="priceRange">
            <label class="form-label mt-2">Sort By</label>
            <select class="form-select" id="sortBy"><option value="recommended">Recommended</option><option value="cheap">Cheapest</option><option value="fast">Fastest</option><option value="rated">Highest Rated</option></select>
          </div>
        </aside>
        <section class="col-lg-9"><div id="resultsSummary" class="mb-3"></div><div class="results-list" id="resultsList"></div></section>
      </div>
    </div>
  </main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="toast-body"></div></div></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js?v=3"></script><script src="js/app.js?v=4"></script><script src="js/search.js?v=3"></script>
</body>
</html>
