<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking | TransitHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/animations.css?v=3">
  <link rel="stylesheet" href="css/responsive.css?v=3">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top glass-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-train-front"></i> TransitHub</a>
      <div class="ms-auto"><a class="btn btn-outline-info btn-sm" href="dashboard.html">Dashboard</a></div>
    </div>
  </nav>

  <main class="page-shell">
    <div class="container">
      <div class="page-heading">
        <p class="eyebrow">Booking Details</p>
        <h1>Passenger and payment</h1>
      </div>
      <div class="row g-4">
        <section class="col-lg-7">
          <form class="glass-card" id="bookingForm" novalidate>
            <h2 class="h5 mb-3">Passenger Details</h2>
            <p class="form-note" id="passengerCountNote"></p>
            <div id="passengerForms"></div>

            <h2 class="h5 mt-4 mb-3">Payment Simulation</h2>
            <div class="payment-options">
              <label><input type="radio" name="payment" value="UPI" checked> UPI</label>
              <label><input type="radio" name="payment" value="Card"> Card</label>
              <label><input type="radio" name="payment" value="Wallet"> Wallet</label>
            </div>
            <button class="btn btn-info btn-lg w-100 mt-4" type="submit">Pay & Generate Ticket</button>
          </form>
        </section>

        <aside class="col-lg-5">
          <div class="glass-card" id="bookingSummary"></div>
          <div class="ticket-card mt-4 d-none" id="ticketCard">
            <div class="d-flex justify-content-between">
              <h2 class="h5">Digital Ticket</h2>
              <span id="ticketId"></span>
            </div>
            <div id="ticketBody"></div>
            <div class="qr-block" aria-label="QR style block"></div>
            <button class="btn btn-outline-info w-100 mt-3" id="downloadTicket" type="button"><i class="bi bi-download"></i> Download Ticket</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="toast-body"></div></div></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js?v=3"></script>
  <script src="js/app.js?v=4"></script>
  <script src="js/booking.js?v=3"></script>
</body>
</html>
