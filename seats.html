<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Seats | TransitHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3"><link rel="stylesheet" href="css/animations.css?v=3"><link rel="stylesheet" href="css/responsive.css?v=3">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top glass-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-train-front"></i> TransitHub</a><div class="ms-auto"><a class="btn btn-outline-info btn-sm" href="search.html">Back to Search</a></div></div></nav>
  <main class="page-shell"><div class="container"><div class="page-heading"><p class="eyebrow">Seat Selection</p><h1>Choose your preferred seats</h1></div><div class="row g-4"><section class="col-lg-8"><div class="glass-card"><div class="seat-legend"><span><i class="seat sample"></i> Available</span><span><i class="seat sample selected"></i> Selected</span><span><i class="seat sample booked"></i> Booked</span></div><div id="seatGrid" class="seat-grid"></div></div></section><aside class="col-lg-4"><div class="glass-card trip-summary"><h2 class="h5">Trip Summary</h2><div id="tripInfo"></div><hr><p>Selected Seats: <strong id="selectedSeats">None</strong></p><p>Total Fare: <strong id="totalFare">₹0</strong></p><button class="btn btn-info w-100" id="continueBooking">Continue Booking</button></div></aside></div></div></main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="toast-body"></div></div></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/storage.js?v=3"></script><script src="js/app.js?v=4"></script><script src="js/seats.js?v=3"></script>
